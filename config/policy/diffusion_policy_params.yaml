mode: diffusion
exp_name: train_diffusion      #eval_diffusion, train_diffusion
is_eval: 1                     #0
checkpoint_path: /home/wawa/catkin_RL/src/rl_racing/experiments/outputs/train_diffusion/train_diffusion_2024.12.27-21.23.48/checkpoints/latest.ckpt #need to be modified

checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-mean_reward={mean_reward:.3f}.ckpt
    k: 5
    mode: max
    monitor_key: mean_reward
dataloader:
  batch_size: 64
  num_workers: 8
  persistent_workers: false
  pin_memory: false
  shuffle: true
dataset_obs_steps: 2
ema:
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0
horizon: 10
keypoint_visible_rate: 1.0
logging:
  project: diffusion_policy_debug
  resume: true
  tags:
  - train_diffusion_transformer_hybrid
  - single_uav
n_action_steps: 8
n_latency_steps: 0
n_obs_steps: 2
name: train_diffusion_transformer_hybrid
obs_as_cond: true
optimizer:
  betas:
  - 0.9
  - 0.95
  learning_rate: 0.0001
  obs_encoder_weight_decay: 1.0e-06
  transformer_weight_decay: 0.001
past_action_visible: false
noise_scheduler:
  beta_end: 0.02
  beta_schedule: squaredcos_cap_v2
  beta_start: 0.0001
  clip_sample: true
  num_train_timesteps: 100
  prediction_type: epsilon
  variance_type: fixed_small
policy:
  causal_attn: true
  crop_shape:
  - 128
  - 128
  eval_fixed_crop: true
  horizon: 10
  n_action_steps: 8
  n_cond_layers: 0
  n_emb: 256
  n_head: 4
  n_layer: 8
  n_obs_steps: 2
  num_inference_steps: 100
  obs_as_cond: true
  obs_encoder_group_norm: true
  p_drop_attn: 0.3
  p_drop_emb: 0.0
  shape_meta:
    action:
      shape:
      - 2
    obs:
      agent_pos:
        shape:
        - 10
        type: low_dim
      image:
        shape:
        - 1
        - 348
        - 348
        type: rgb
  time_as_cond: true
