mode: Meta
exp_name: train_MAML
is_eval: 0   

# Firefly主参数配置
mpc_params:
  per: 1
  prop_mode: "TSinf"
  opt_mode: "CEM"
  npart: 20
  plan_hor: 5
  num_nets: 1
  epsilon: 0.001
  alpha: 0.25
  popsize: 50
  max_iters: 3
  num_elites: 10

model_params:
  load_model: True
  load_model_path: /home/wawa/catkin_meta/src/MBRL_transport/checkpoints/Meta
  model_in: 18
  model_out: 12 
