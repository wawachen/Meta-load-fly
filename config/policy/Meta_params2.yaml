  update_step: 5
  update_step_test: 10

# Firefly训练相关参数配置
exp_params:
  seed: 222
  task_hor: 700
  log_sample_data: False
  k_spt: 15
  wind_condition_x: 0.0
  wind_condition_y: 0.0
  L: 0.6
  


